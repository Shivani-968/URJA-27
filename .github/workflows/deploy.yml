# .github/workflows/deploy.yml
name: Deploy Vite App to GitHub Pages

# Controls when the workflow will run
on:
  # Triggers the workflow on pushes to the 'main' branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions needed for GitHub Actions to deploy to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# The deployment job
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    
    # Ensures only one deployment job runs at a time
    concurrency:
      group: "pages"
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build project
        working-directory: ./frontend
        run: npm run build

      # Ensure CNAME is in the dist folder so custom domain persists
      - name: Copy CNAME to dist
        run: cp ./frontend/CNAME ./frontend/dist/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4